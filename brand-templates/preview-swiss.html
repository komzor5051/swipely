<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&display=swap');
* { box-sizing: border-box; margin: 0; padding: 0; }
body { width: 1080px; height: 1080px; overflow: hidden; }
.slide {
  width: 1080px; height: 1080px;
  background: #ffffff;
  padding: 80px 80px 72px;
  display: flex; flex-direction: column;
  font-family: 'Space Grotesk', sans-serif;
}
.topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.brand { font-size: 20px; font-weight: 700; color: #000; letter-spacing: 0.12em; text-transform: uppercase; }
.counter-top { font-size: 18px; color: #999; }
.rule-thick { width: 100%; height: 3px; background: #000; margin-bottom: 56px; }
.main { display: flex; flex: 1; gap: 56px; align-items: flex-start; }
.left { width: 35%; }
.num { font-size: 200px; font-weight: 700; color: #000; line-height: 1; }
.right { flex: 1; border-left: 3px solid #000; padding-left: 40px; display: flex; flex-direction: column; justify-content: center; }
.type-label { font-size: 18px; font-weight: 700; color: #000; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 24px; }
.title { font-size: 68px; font-weight: 700; color: #000; line-height: 1.1; }
.mini-rule { width: 40px; height: 3px; background: #000; margin: 32px 0; }
.body { font-size: 34px; font-weight: 300; color: #444; line-height: 1.65; }
.footer { border-top: 1px solid #e0e0e0; padding-top: 24px; display: flex; justify-content: space-between; }
.footer-left { font-size: 18px; font-weight: 300; color: #999; }
.footer-right { font-size: 18px; font-weight: 700; color: #999; letter-spacing: 0.1em; }
</style>
</head>
<body>
<div class="slide">
  <div class="topbar">
    <span class="brand">Swiss</span>
    <span class="counter-top">01 / 07</span>
  </div>
  <div class="rule-thick"></div>
  <div class="main">
    <div class="left"><div class="num">01</div></div>
    <div class="right">
      <div class="type-label">Chapter</div>
      <div class="title">Заголовок карусели</div>
      <div class="mini-rule"></div>
      <div class="body">Короткое описание темы поста</div>
    </div>
  </div>
  <div class="footer">
    <span class="footer-left">@swipely</span>
    <span class="footer-right">SWISS</span>
  </div>
</div>
</body>
</html>
