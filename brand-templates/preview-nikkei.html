<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&family=Space+Grotesk:wght@400;700&display=swap');
* { box-sizing: border-box; margin: 0; padding: 0; }
body { width: 1080px; height: 1080px; overflow: hidden; }
.slide {
  width: 1080px; height: 1080px;
  background: #ffffff;
  padding: 72px 80px;
  display: flex; flex-direction: column;
  font-family: 'Inter', sans-serif;
}
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.brand { font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700; color: #000; letter-spacing: 0.14em; }
.date { font-size: 20px; font-weight: 300; color: #888; }
.rule-thick { width: 100%; height: 3px; background: #000; margin-bottom: 48px; }
.headline { font-size: 88px; font-weight: 700; color: #000; line-height: 1.05; flex: 1; display: flex; align-items: center; }
.rule-thin { width: 100%; height: 1px; background: #e8e8e8; margin: 36px 0; }
.body { font-size: 36px; font-weight: 300; color: #333; line-height: 1.7; }
.footer { display: flex; justify-content: space-between; align-items: center; margin-top: 40px; }
.dots { display: flex; gap: 8px; align-items: center; }
.dot { height: 8px; border-radius: 4px; }
.dot.active { width: 24px; background: #000; }
.dot.inactive { width: 8px; background: #e0e0e0; }
.page-num { font-size: 18px; font-weight: 300; color: #888; }
</style>
</head>
<body>
<div class="slide">
  <div class="header">
    <span class="brand">NIKKEI</span>
    <span class="date">@swipely</span>
  </div>
  <div class="rule-thick"></div>
  <div class="headline">Заголовок карусели</div>
  <div class="rule-thin"></div>
  <div class="body">Короткое описание темы поста</div>
  <div class="footer">
    <div class="dots">
      <div class="dot active"></div>
      <div class="dot inactive"></div>
      <div class="dot inactive"></div>
      <div class="dot inactive"></div>
      <div class="dot inactive"></div>
      <div class="dot inactive"></div>
      <div class="dot inactive"></div>
    </div>
    <span class="page-num">01 / 07</span>
  </div>
</div>
</body>
</html>
