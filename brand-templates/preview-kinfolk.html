<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400&display=swap');
* { box-sizing: border-box; margin: 0; padding: 0; }
body { width: 1080px; height: 1080px; overflow: hidden; }
.slide {
  width: 1080px; height: 1080px;
  background: #f7f4ee;
  padding: 80px;
  display: flex; flex-direction: column;
  position: relative;
}
.tag { font-family: 'Inter', sans-serif; font-weight: 300; font-size: 22px; color: #999; letter-spacing: 0.16em; text-transform: uppercase; font-style: italic; }
.counter { font-family: 'Playfair Display', serif; font-size: 28px; color: #c8b89a; margin-top: 24px; }
.title { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 96px; color: #1a1a1a; line-height: 1.05; margin-top: 40px; flex: 1; display: flex; align-items: center; }
.rule { width: 60px; height: 2px; background: #c8b89a; margin: 0 0 36px 0; }
.body { font-family: 'Inter', sans-serif; font-weight: 300; font-size: 38px; color: #555; line-height: 1.7; }
.footer { display: flex; justify-content: space-between; align-items: center; margin-top: 48px; }
.username { font-family: 'Inter', sans-serif; font-weight: 300; font-size: 24px; color: #999; }
.page { font-family: 'Playfair Display', serif; font-size: 24px; color: #c8b89a; }
hl { font-style: italic; color: #c8b89a; }
</style>
</head>
<body>
<div class="slide">
  <div class="tag">personal brand</div>
  <div class="counter">01 / 05</div>
  <div class="title"><span>5 принципов эксперта, которому доверяют</span></div>
  <div class="rule"></div>
  <div class="body">Как выстроить личный бренд, который работает на вас даже когда вы молчите</div>
  <div class="footer">
    <span class="username">@expert</span>
    <span class="page">01</span>
  </div>
</div>
</body>
</html>
